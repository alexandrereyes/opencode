# Projeto de exemplo dos testes da Bancada (plano, seção 14). Cada teste exercita uma parte do contrato.
versao  = 1
projeto = "bancada-exemplo"
caches  = ["cache/"]
fora    = ["scripts/por-fora"]

[teste.simples]
rotulo    = "Simples"
aparelhos = { min = 0, max = 0 }
build     = "scripts/build"
run       = "scripts/run"

[teste.lento]
herda  = "simples"
rotulo = "Lento"
args   = ["--dorme", "5"]

[teste.android]
rotulo    = "Android"
precisa   = ["android"]
aparelho  = { api = ">=36", enxuto = "aceita" }
aparelhos = { min = 1, max = 2 }
build     = "scripts/build"
plan      = "scripts/plan"
run       = "scripts/run"

[teste.ios]
rotulo    = "iOS"
precisa   = ["ios"]
aparelho  = { ios = ">=26.0", modelo = "iPhone 17 Pro" }
aparelhos = { min = 1, max = 2 }
build     = "scripts/build"
run       = "scripts/run"

[teste.fisico]
rotulo   = "Celular"
precisa  = ["android-fisico"]
aparelho = { etiquetas = ["teste"] }
run      = "scripts/run"

[teste.exclusivo]
herda     = "simples"
rotulo    = "Exclusivo"
exclusivo = ["exemplo:servidor-dev"]

[teste.servidor]
herda   = "android"
rotulo  = "Android + servidor"
precisa = ["android", "docker"]
args    = ["--server"]
